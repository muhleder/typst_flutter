[package]
name = "typst_flutter"
version = "3.0.0"
edition = "2024"
description = "Native Typst typesetting compiler for Flutter via Rust FFI"
license = "Apache-2.0"

[lib]
name = "typst_flutter"
crate-type = ["cdylib", "staticlib"]

[dependencies]
typst = "0.15.0"
typst-pdf = "0.15.0"
typst-render = "0.15.0"
typst-svg = "0.15.0"
typst-eval = "0.15.0"
serde_json = "1.0"
typst-layout = "0.15.0"
typst-utils = "0.15.0"
comemo = "0.5.1"
flutter_rust_bridge = "=2.14.0-beta.2"
time = "0.3.47"
flate2 = "1"
tar = "0.4"
thiserror = "2"

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = "3"

[target.'cfg(target_family = "wasm")'.dependencies]
js-sys = "0.3"

[profile.release]
opt-level = "z"      # optimise for binary size
lto = "fat"          # cross-crate link-time optimisation (smaller binaries)
codegen-units = 1    # maximum intra-crate optimisation (thin LTO handles parallelism)
strip = true         # strip debug symbols from the output
panic = "abort"      # smaller binary: no unwinding tables

# wasm-opt must be told about the threaded build's features, otherwise it
# refuses to validate the module that `build-web` produces.
[package.metadata.wasm-pack.profile.release]
wasm-opt = [
  "-Oz",
  "--enable-threads",
  "--enable-bulk-memory",
  "--enable-mutable-globals",
  "--enable-sign-ext",
  "--enable-nontrapping-float-to-int",
  "--enable-reference-types",
  "--enable-multivalue",
  "--enable-extended-const",
  "--enable-simd",
]
