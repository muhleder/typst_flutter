name: CI

on:
  push:
    branches: [main,dev]
  pull_request:
    branches: [main,dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check format
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze

  rust-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Check format
        run: cargo fmt --all -- --check
        working-directory: rust
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: rust
      - name: Audit dependencies
        uses: actions-rust-lang/audit@v1
        with:
          workingDirectory: rust
          ignore: "RUSTSEC-2026-0194,RUSTSEC-2026-0195"

  dart-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@just
      - name: Install dependencies
        run: just get
      - name: Run tests with coverage
        run: just test-coverage
      - name: Filter coverage (exclude generated code)
        run: dart run tool/filter_lcov.dart
      - name: Upload Dart Coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          flags: dart
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev xvfb
      - name: Run Integration Tests
        if: runner.os != 'Linux'
        run: just test-integration
      - name: Run Integration Tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run just test-integration

  rust-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: taiki-e/install-action@just
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info --ignore-filename-regex "frb_generated"
        working-directory: rust
      - name: Upload Rust Coverage
        uses: codecov/codecov-action@v7
        with:
          files: rust/lcov.info
          flags: rust

  # ── Web (WebAssembly) ─────────────────────────────────────────────────────
  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Install wasm toolchain
        run: |
          cargo install wasm-pack
          cargo install flutter_rust_bridge_codegen --version 2.14.0-beta.2 --locked
      - name: Build the wasm bundle
        run: flutter_rust_bridge_codegen build-web --release -o ../example/web
      - name: Enforce the wasm size budget
        run: |
          sudo apt-get update && sudo apt-get install -y brotli
          wasm=$(stat -c%s example/web/pkg/typst_flutter_bg.wasm)
          br=$(brotli -q 11 -c example/web/pkg/typst_flutter_bg.wasm | wc -c)
          echo "wasm: $wasm bytes, brotli: $br bytes"
          # Budget: 24 MiB raw / 8 MiB brotli (docs/superpowers/specs, section 10)
          test "$wasm" -le 25165824
          test "$br" -le 8388608
      - name: Build the example for the web
        run: flutter build web --wasm
        working-directory: example
      - uses: actions/upload-artifact@v7
        with:
          name: web-bundle
          path: example/web/pkg

  web-e2e:
    needs: web-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - uses: nanasess/setup-chromedriver@v2
      - uses: actions/download-artifact@v8
        with:
          name: web-bundle
          path: example/web/pkg
      - name: Install wasm toolchain
        run: |
          cargo install wasm-pack
          cargo install flutter_rust_bridge_codegen --version 2.14.0-beta.2 --locked
      - name: Run the browser tests
        working-directory: example
        run: |
          flutter pub get
          # One chromedriver for both runs; starting it twice fails on the port.
          chromedriver --port=4444 &
          flutter drive --driver=test_driver/integration_test.dart \
            --target=integration_test/web_test.dart -d chrome --wasm \
            --web-header=Cross-Origin-Opener-Policy=same-origin \
            --web-header=Cross-Origin-Embedder-Policy=require-corp
          flutter drive --driver=test_driver/integration_test.dart \
            --target=integration_test/web_test.dart -d chrome \
            --web-header=Cross-Origin-Opener-Policy=same-origin \
            --web-header=Cross-Origin-Embedder-Policy=require-corp

  pub-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - name: Install pana
        run: dart pub global activate pana
      - name: Verify Pub Package Score (160/160)
        run: dart pub global run pana --exit-code-threshold 0 .
